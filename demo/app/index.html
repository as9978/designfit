<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Space+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0a0f;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ── Toast / Alert card ───────────────────────────────────────────
         First-attempt build, eyeballed from the Figma frame. designfit will
         flag where it drifts from the design tokens + geometry. */
      #card {
        position: relative;
        width: 479px;
        height: 118px;
        background: #131318;          /* fixed: color/surface */
        border: 1px solid #5e3e41;    /* ok: color/border */
        border-radius: 6px;           /* fixed: radius/md */
      }

      #icon { position: absolute; left: 25px; top: 25px; width: 20px; height: 24px;
        display: flex; align-items: center; }
      .info {
        width: 20px; height: 20px; border-radius: 50%;
        border: 2px solid #3ecf8e; color: #3ecf8e;
        display: flex; align-items: center; justify-content: center;
        font-family: "Space Mono", monospace; font-size: 12px; font-weight: 700;
      }

      #heading {
        position: absolute; left: 69px; top: 25px;   /* fixed: x = 69 */
        width: 215px; height: 24px;
        font-family: "Space Mono", monospace; font-weight: 700;
        font-size: 16px; line-height: 24px;
        color: #e4e1e9;               /* fixed: color/text/primary */
        white-space: nowrap; overflow: hidden;
      }

      #body {
        position: absolute; left: 69px; top: 53px;   /* fixed: x = 69 */
        width: 329px; height: 40px;
        font-family: "Geist", sans-serif; font-weight: 400;
        font-size: 14px; line-height: 20px;          /* fixed: 14px */
        color: #e8bcbe;               /* ok: color/text/muted */
      }

      #close {
        position: absolute; left: 422px; top: 25px; width: 8px; height: 12px;
        display: flex; align-items: center; justify-content: center; overflow: visible;
        color: #b59a9c; font-family: "Geist", sans-serif; font-size: 17px; line-height: 1;
      }
    </style>
  </head>
  <body>
    <div id="card" data-designfit-id="2001:92">
      <div id="icon" data-designfit-id="2001:94"><div class="info">i</div></div>
      <div id="heading" data-designfit-id="2001:98">System Update Complete</div>
      <div id="body" data-designfit-id="2001:100">
        Core modules have been successfully synchronized across all nodes.
      </div>
      <div id="close" data-designfit-id="2001:101">×</div>
    </div>
  </body>
</html>
